<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Inversiones JCJ</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f8f8;
        color: #1d2126;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1d2126; color: #f7f8f8; }
        .card { background: #262b31; border-color: #363c44; }
      }
      .card {
        max-width: 380px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e3e6e8;
        border-radius: 16px;
        padding: 28px 24px;
      }
      .logo {
        width: 56px; height: 56px;
        border-radius: 14px;
        margin: 0 auto 16px;
        display: grid; place-items: center;
        background: #0f766e; color: #ffffff;
        font-weight: 600; font-size: 18px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; margin: 0 0 20px; opacity: .75; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0; border-radius: 10px;
        background: #0f766e; color: #ffffff;
        font-size: 14px; font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">JCJ</div>
      <h1>Te quedaste sin señal</h1>
      <p>
        No se pudo cargar la pantalla porque el teléfono no tiene internet.
        Los cobros que ya registraste están guardados en el servidor; los que
        hagas ahora sí necesitan conexión.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
